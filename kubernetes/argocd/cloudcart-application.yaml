
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudcart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kunal015-P/CloudCart.git
    targetRevision: main
    path: kubernetes
    directory:
      recurse: true
      exclude: argocd/**
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudcart
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
