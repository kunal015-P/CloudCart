
name: cloudcart

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cloudcart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: cloudcart-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - cloudcart-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-service:
    image: kunal161/cloudcart-user-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: cloudcart-user-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudcart-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  product-service:
    image: kunal161/cloudcart-product-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: cloudcart-product-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cloudcart-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cart-service:
    image: kunal161/cloudcart-cart-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    container_name: cloudcart-cart-service
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
    depends_on:
      redis:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks:
      - cloudcart-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-service:
    image: kunal161/cloudcart-order-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: cloudcart-order-service
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudcart-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ai-service:
    image: kunal161/cloudcart-ai-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    container_name: cloudcart-ai-service
    restart: unless-stopped
    environment:
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL}
    depends_on:
      product-service:
        condition: service_healthy
    networks:
      - cloudcart-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: kunal161/cloudcart-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudcart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - cloudcart-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  cloudcart-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
