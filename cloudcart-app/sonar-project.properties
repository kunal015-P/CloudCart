
# Project information
sonar.projectKey=CloudCart
sonar.projectName=CloudCart
sonar.projectVersion=1.0

# Source directories
sonar.sources=services,frontend/src

# Test directory
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude generated and dependency files
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**,**/.venv/**,**/venv/**,**/coverage/**

# Python configuration
sonar.python.version=3.12
